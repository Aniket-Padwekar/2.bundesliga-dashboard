<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2. Bundesliga Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --surface-2: #1C2129;
    --border: #262C36;
    --text: #F0F6FC;
    --text-muted: #8B949E;
    --accent: #4C8DFF;
    --accent-soft: rgba(76, 141, 255, 0.14);
    --accent-text: #FFFFFF;
    --diff-1: #2E7D46; --diff-2: #6FA85C; --diff-3: #6B7280; --diff-4: #C2564B; --diff-5: #A32E2E;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    position: relative;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { overflow-x: hidden; max-width: 100%; }
  .scoreboard-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; }

  /* ── ORIGINAL ABSTRACT WATERMARK (not the official league mark — see note) ── */
  .watermark {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .watermark::before {
    content: "2."; position: absolute; top: -8vw; right: -4vw;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
    font-size: 62vw; line-height: 1; color: rgba(255,255,255,0.025);
    filter: blur(2px);
  }
  .watermark::after {
    content: ""; position: absolute; top: 12vh; right: 6vw;
    width: 46vw; height: 46vw; border-radius: 50%;
    border: 3vw solid rgba(255,255,255,0.018);
    filter: blur(6px);
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: rgba(13,17,23,0.92); backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent); transition: background 0.4s ease;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .brand-mark::before {
    content: "";
    position: absolute; width: 60%; height: 60%;
    border: 2.5px solid rgba(255,255,255,0.9); border-radius: 50%;
  }
  .brand-mark::after {
    content: "";
    position: absolute; width: 2.5px; height: 130%;
    background: rgba(255,255,255,0.9); transform: rotate(25deg);
  }
  .brand-mark.has-real-logo::before, .brand-mark.has-real-logo::after { display: none; }
  .brand-text { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; }
  .brand-text span { color: var(--text-muted); font-weight: 500; }

  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .tab-nav { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .tab-btn { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 500; padding: 7px 14px; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: var(--accent-text); }

  select.club-select {
    appearance: none; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
    padding: 9px 34px 9px 14px; border-radius: 8px; cursor: pointer; min-width: 190px;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  select.club-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 28px 80px; position: relative; z-index: 1; }

  /* ── MOBILE LAYOUT ── */

  .page { display: none; }
  .page.active { display: block; }

  /* ── HERO ── */
  .hero {
    display: grid; grid-template-columns: 1fr auto; gap: 24px;
    background: linear-gradient(135deg, var(--accent-soft), transparent 60%), var(--surface);
    border: 1px solid var(--border); border-radius: 16px; padding: 32px 36px; margin-bottom: 28px;
  }
  .hero-eyebrow { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .hero-club-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(32px, 5vw, 54px); line-height: 1; color: var(--accent); transition: color 0.4s ease; margin-bottom: 18px; overflow-wrap: break-word; }
  .hero-stats-row { display: flex; gap: 32px; flex-wrap: wrap; }
  .hero-stat { min-width: 78px; }
  .hero-stat-value { font-size: 30px; line-height: 1; margin-bottom: 4px; }
  .hero-stat-label { font-size: 12px; color: var(--text-muted); }
  .hero-right { display: flex; flex-direction: column; justify-content: center; gap: 14px; padding-left: 24px; border-left: 1px solid var(--border); min-width: 170px; }
  .promo-ring-wrap { display: flex; align-items: center; gap: 12px; }
  .promo-pct { font-size: 28px; line-height: 1; color: var(--accent); }
  .promo-label { font-size: 12px; color: var(--text-muted); line-height: 1.35; max-width: 110px; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 40px 0 14px; flex-wrap: wrap; gap: 10px; }
  .section-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; }
  .season-tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; flex-wrap: wrap; }
  .season-tab { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; }
  .season-tab.active { background: var(--accent); color: var(--accent-text); }

  .chart-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  .compare-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); cursor: pointer; user-select: none; }
  .compare-toggle input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px 20px 12px; }
  .chart-holder { position: relative; height: 320px; }
  .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 4px 4px; font-size: 12px; color: var(--text-muted); }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

  .tables-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; margin-top: 14px; }
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .table-card-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  .table-card-title { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; }
  .table-card-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  thead th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th.num, td.num { text-align: right; }
  tbody td { padding: 9px 8px; font-size: 13px; border-bottom: 1px solid var(--surface-2); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.is-selected { background: var(--accent-soft); }
  tbody tr.is-selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .pos-cell { color: var(--text-muted); width: 24px; }
  .team-cell { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .team-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .promo-bar-wrap { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .promo-bar-track { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .promo-bar-fill { height: 100%; border-radius: 3px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 14px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat-tile-value { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 3px; }
  .stat-tile-label { font-size: 12px; color: var(--text-muted); }

  .footer-note { margin-top: 44px; font-size: 12px; color: var(--text-muted); line-height: 1.6; max-width: 640px; }

  /* ── FIXTURES PAGE ── */
  .fdr-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 18px; font-size: 12px; color: var(--text-muted); align-items: center; }
  .fdr-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .fdr-chip { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
  .fdr-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
  .fdr-nav-btn { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .fdr-nav-btn:disabled { opacity: 0.35; cursor: default; }
  .fdr-nav-btn:not(:disabled):hover { border-color: var(--accent); }
  .fdr-nav-label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
  .fdr-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: auto; }
  table.fdr { border-collapse: separate; border-spacing: 0; min-width: 900px; }
  table.fdr thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; padding: 10px 8px; font-size: 11px; }
  table.fdr thead th.team-col-head { left: 0; z-index: 3; text-align: left; padding-left: 16px; }
  table.fdr td.team-col { position: sticky; left: 0; background: var(--surface); z-index: 1; padding: 8px 16px; border-right: 1px solid var(--border); }
  table.fdr td.fdr-cell { padding: 6px; text-align: center; }
  .fdr-pill {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: 74px; padding: 6px 4px; border-radius: 8px; color: #fff;
    font-size: 11.5px; font-weight: 600; line-height: 1.3;
  }
  .fdr-pill .fdr-opp { font-weight: 700; }
  .fdr-pill .fdr-loc { font-weight: 500; opacity: 0.85; font-size: 10.5px; }
  table.fdr tbody tr:hover td { background: var(--surface-2); }
  table.fdr tbody tr:hover td.team-col { background: var(--surface-2); }

  /* ── PROMOTION REPORT ── */
  .report-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  .report-title { display: flex; align-items: center; gap: 14px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(28px, 4vw, 42px); line-height: 1; color: var(--accent); }
  .report-print { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .report-print:hover { border-color: var(--accent); }
  .report-meta { font-size: 12.5px; color: var(--text-muted); margin-bottom: 18px; }
  .tier-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .tier-badge { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; padding: 6px 14px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
  .tier-badge.tier-mid, .tier-badge.tier-danger { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .tier-rule { font-size: 12.5px; color: var(--text-muted); }
  .report-summary { font-size: 14.5px; line-height: 1.7; max-width: 820px; margin: 0 0 22px; }
  .report-summary p { margin: 0 0 10px; }
  .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .report-grid { grid-template-columns: 1fr; } }
  .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; break-inside: avoid; }
  .report-card.wide { grid-column: 1 / -1; }
  .report-card h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700; margin: 0 0 4px; }
  .report-card .sub { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; line-height: 1.5; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--surface-2); font-size: 13.5px; }
  .kv:last-of-type { border-bottom: none; }
  .kv > span { color: var(--text-muted); }
  .kv > strong { font-weight: 600; text-align: right; }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .mini-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 6px 6px; border-bottom: 1px solid var(--border); }
  .mini-table td { padding: 7px 6px; border-bottom: 1px solid var(--surface-2); vertical-align: top; }
  .mini-table td.num, .mini-table th.num { text-align: right; }
  .chip { display: inline-block; min-width: 24px; text-align: center; padding: 2px 7px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #fff; }
  .chip.W { background: #2E7D46; } .chip.D { background: #6B7280; } .chip.L { background: #A32E2E; }
  .diff-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .report-note { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin: 10px 0 0; }
  .report-history-holder { position: relative; height: 240px; margin-top: 8px; }
  .report-method { font-size: 12px; color: var(--text-muted); line-height: 1.7; }
  .report-method p { margin: 0 0 8px; }
  .report-method ul { margin: 4px 0 0 18px; padding: 0; }

  @page { margin: 14mm; }
  @media print {
    :root { --bg: #fff; --surface: #fff; --surface-2: #f1f3f5; --border: #cfd4da; --text: #111827; --text-muted: #4b5563; }
    html, body { background: #fff; }
    .topbar, .watermark, .report-print { display: none !important; }
    .page { display: none !important; }
    #page-report { display: block !important; }
    .wrap { padding: 0; max-width: none; }
    .report-card { break-inside: avoid; }
  }

  /* ── WEAK AREAS + SHOT MAP ── */
  .shots-layout { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .shots-layout { grid-template-columns: 1fr; } }
  .shots-toggle { margin-bottom: 12px; display: inline-flex; }
  .shots-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-top: 12px; font-size: 13px; font-weight: 700; color: var(--text); }
  .lg-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }
  .lg-diamond { display: inline-block; width: 9px; height: 9px; transform: rotate(45deg); margin-right: 9px; vertical-align: 0; }

  /* ── SITE DISCLAIMER ── */
  .site-disclaimer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-muted); line-height: 1.6; max-width: 760px; }


  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── MOBILE OVERRIDES (always last: guarantees they win the cascade regardless of source-order elsewhere) ── */
  @media (max-width: 640px) { .wrap { padding: 20px 16px 60px; } }

  @media (max-width: 680px) {
    .topbar { flex-wrap: wrap; row-gap: 10px; padding: 12px 16px; }
    .topbar-right { width: 100%; flex-wrap: wrap; gap: 8px; }
    .tab-nav { flex: 1 1 100%; }
    .tab-btn { flex: 1; text-align: center; padding: 8px 4px; font-size: 12px; }
    select.club-select { flex: 1 1 100%; width: 100%; min-width: 0; }
    .hero { grid-template-columns: 1fr; padding: 22px 18px; }
    .hero-club-name { font-size: clamp(26px, 8vw, 40px); }
    .hero-right {
      border-left: none; border-top: 1px solid var(--border);
      padding-left: 0; padding-top: 16px; margin-top: 4px;
      flex-direction: row; flex-wrap: wrap; min-width: 0; gap: 20px;
    }
  }

  @media (max-width: 900px) { .tables-grid { grid-template-columns: 1fr; } }

  @media (max-width: 680px) {
    table.fdr { min-width: 0; width: 100%; table-layout: fixed; }
    .fdr-pill { width: auto; min-width: 46px; padding: 5px 2px; }
    table.fdr td.fdr-cell { padding: 4px 2px; }
    table.fdr thead th { padding: 8px 3px; font-size: 10px; }
    .team-col { max-width: 92px; padding: 8px 6px !important; }
    .team-col .team-cell { overflow: hidden; gap: 6px; }
    .team-col .team-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  }

  @media (max-width: 360px) {
    .wrap { padding-left: 10px; padding-right: 10px; }
    .fdr-pill { min-width: 40px; padding: 5px 1px; font-size: 10.5px; }
    table.fdr td.fdr-cell { padding: 3px 1px; }
    .team-col { max-width: 64px; padding: 8px 4px !important; }
    .fdr-nav-btn { padding: 8px 8px; font-size: 11.5px; }
  }
</style>
</head>
<body>

<div class="watermark" aria-hidden="true"></div>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark" id="brandMark"></div>
    <div class="brand-text">2. BUNDESLIGA <span>TRACKER</span></div>
  </div>
  <div class="topbar-right">
    <div class="tab-nav">
      <button class="tab-btn active" data-page="overview">Overview</button>
      <button class="tab-btn" data-page="fixtures">Fixtures</button>
      <button class="tab-btn" data-page="report">Promotion report</button>
    </div>
    <select class="club-select" id="clubSelect" aria-label="Select a club"></select>
  </div>
</div>

<div class="wrap">

  <!-- ══════════════ OVERVIEW PAGE ══════════════ -->
  <div class="page active" id="page-overview">

    <section class="hero">
      <div class="hero-left">
        <div class="hero-eyebrow" id="heroSeasonLabel">2026/27 season</div>
        <div class="hero-club-name" id="heroClubName">—</div>
        <div class="hero-stats-row">
          <div class="hero-stat"><div class="hero-stat-value scoreboard-num" id="statPosition">–</div><div class="hero-stat-label">Position</div></div>
          <div class="hero-stat"><div class="hero-stat-value scoreboard-num" id="statPoints">–</div><div class="hero-stat-label">Points</div></div>
          <div class="hero-stat"><div class="hero-stat-value scoreboard-num" id="statRecord">–</div><div class="hero-stat-label">W-D-L</div></div>
          <div class="hero-stat"><div class="hero-stat-value scoreboard-num" id="statGD">–</div><div class="hero-stat-label">Goal diff.</div></div>
        </div>
      </div>
      <div class="hero-right">
        <div class="promo-ring-wrap">
          <div class="promo-pct scoreboard-
